# Builds Themezer-3DS on every push and pull request, and publishes a release for every vX.Y.Z tag.
# Each build takes the latest list of CA certificates from curl.se (checked against its published SHA-256), so a
# release always carries a fresh copy: the app checks HTTPS servers against it until it is three years old.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng
        run: sudo apt-get update && sudo apt-get install -y libpng-dev zlib1g-dev pkg-config
      - name: Run the tests
        run: make test

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the tag

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libraries and tools
        run: |
          dkp-pacman -S --needed --noconfirm 3ds-curl 3ds-mbedtls 3ds-jansson 3ds-libpng 3ds-zlib
          apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates build-essential
          # makerom from source: its Linux release needs a newer glibc than the container has
          curl -fsSL --retry 3 https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz | tar xz -C /tmp
          make -C /tmp/Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)" deps
          make -C /tmp/Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)"
          install -m 755 /tmp/Project_CTR-makerom-v0.19.0/makerom/bin/makerom /usr/local/bin/makerom
          curl -fsSL --retry 3 -o /tmp/bannertool.zip \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -q /tmp/bannertool.zip -d /tmp/bannertool
          # the 64-bit build: the container can't run the 32-bit one next to it
          install -m 755 /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool

      - name: Take the latest CA certificates
        run: |
          curl -fsSL --retry 3 -o /tmp/cacert.pem https://curl.se/ca/cacert.pem
          curl -fsSL --retry 3 -o /tmp/cacert.pem.sha256 https://curl.se/ca/cacert.pem.sha256
          (cd /tmp && sha256sum -c cacert.pem.sha256)
          mv /tmp/cacert.pem romfs/cacert.pem
          grep -m 1 'as of:' romfs/cacert.pem

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: themezer-3ds-${{ github.sha }}
          path: |
            out/themezer-3ds.3dsx
            out/themezer-3ds.cia

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: themezer-3ds-${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            themezer-3ds.3dsx
            themezer-3ds.cia
          generate_release_notes: true
